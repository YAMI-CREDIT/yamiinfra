name: Destroy Created Infrastructure 

on:
  workflow_dispatch:

jobs:
  plan:
    name: plan and review
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: set terraform cloud token
        run: |
          echo "TF_TOKEN_app_terraform_io=${{ secrets.HCP_TOKEN }}" >> $GITHUB_ENV

      - name: terraform init
        run: |
          cd infra
          terraform init

      - name: terraform plan destroy
        run: |
          cd infra
          terraform plan -destroy

  apply:
    name: apply changes
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: dev
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: set terraform cloud token
        run: |
          echo "TF_TOKEN_app_terraform_io=${{ secrets.HCP_TOKEN }}" >> $GITHUB_ENV

      - name: terraform init
        run: |
          cd src
          terraform init

      - name: terraform destroy
        run: |
          cd src
          terraform destroy -auto-approve