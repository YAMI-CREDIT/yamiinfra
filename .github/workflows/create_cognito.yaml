name: Create Cognito

on:
  workflow_dispatch:

jobs:
  plan:
    name: plan and review
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      # - name: run checkov scan
      #   uses: bridgecrewio/checkov-action@v12
      #   with:
      #     output_format: cli
      #     directory: ./infra


      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: set terraform cloud token
        run: |
          echo "TF_TOKEN_app_terraform_io=${{ secrets.HCP_TOKEN }}" >> $GITHUB_ENV

      - name: terraform init
        run: |
          cd src/aws/cognitosetup
          terraform init

      - name: terraform plan
        run: |
          cd src/aws/cognitosetup
          terraform plan

  apply:
    name: apply changes
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: dev
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: set terraform cloud token
        run: |
          echo "TF_TOKEN_app_terraform_io=${{ secrets.HCP_TOKEN }}" >> $GITHUB_ENV
    
      - name: terraform init
        run: |
          cd src/aws/cognitosetup
          terraform init

      - name: terraform apply
        run: |
          cd src/aws/cognitosetup
          terraform apply -auto-approve